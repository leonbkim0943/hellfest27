name: V5.4 production compatibility check
on:
  push:
    branches: [v54-production-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tools/test_v54_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v54-production-check
          path: ux-audit-output/
