name: Audit artist links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/artist-link-audit.yml']
permissions:
  contents: read
concurrency:
  group: artist-link-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube Music lookup library
        run: python -m pip install ytmusicapi==1.12.4
      - name: Validate and collect artist links
        run: |
          python -m py_compile tools/audit_artist_links.py
          python tools/audit_artist_links.py
      - name: Upload audit for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-audit
          path: link-audit.json
          if-no-files-found: warn
