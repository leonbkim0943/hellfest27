name: Complete artist discovery (pass 3)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/artist-discovery-pass3.yml']
permissions:
  contents: write
concurrency:
  group: artist-discovery-data
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ytmusicapi==1.12.4 beautifulsoup4==4.13.4
      - name: Fill and recheck gaps with bounded retries
        run: |
          python -m py_compile tools/complete_artist_discovery.py
          python tools/complete_artist_discovery.py
          python tools/complete_artist_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artist-discovery-pass3
          path: |
            data/artist-discovery.json
            data/artist-review-queue.json
      - name: Publish public metadata and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist-discovery.json data/artist-review-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish third-pass discovery metadata and remaining review queue'
          git pull --rebase origin main
          git push origin HEAD:main
