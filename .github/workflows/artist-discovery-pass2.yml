name: Enrich artist discovery (pass 2)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/artist-discovery-pass2.yml']
permissions:
  contents: write
concurrency:
  group: artist-discovery-data
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ytmusicapi==1.12.4
      - run: python -m py_compile tools/enrich_artist_discovery.py && python tools/enrich_artist_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: artist-discovery-pass2
          path: data/artist-discovery.json
      - name: Publish public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist-discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish second-pass artist discovery metadata'
          git pull --rebase origin main
          git push origin HEAD:main
